<script>
/* Style switcher (development aid). Turn it off for the final site with
   style_switcher: false in _config.yml.
   Shows a "Style" button only when the address has ?dev (remembered in this browser;
   ?dev=0 forgets it) or when running on localhost. Everyone else just gets the site's
   normal look; a link with ?style=... shows that look without any panel. */
(function () {
  var PRESETS = {{ site.data.styles | jsonify }};
  var DEFAULT = {{ site.style | default: "default" | jsonify }};
  if (!PRESETS[DEFAULT]) DEFAULT = Object.keys(PRESETS)[0];

  var KEY = "dbic-style", DEVKEY = "dbic-dev";
  var root = document.documentElement;
  var FONTS = {
    sans: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif',
    humanist: '"Avenir Next", Avenir, "Segoe UI", Seravek, Optima, Candara, sans-serif',
    serif: 'Georgia, "Iowan Old Style", "Palatino Linotype", serif',
    neutral: '"Helvetica Neue", Helvetica, Arial, sans-serif'
  };
  var FONT_LABELS = { sans: "System sans", humanist: "Humanist sans", serif: "Serif (Georgia)", neutral: "Helvetica / Arial" };

  function sget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var qs = new URLSearchParams(location.search);
  if (qs.has("dev")) sset(DEVKEY, qs.get("dev") === "0" ? "" : "1");
  var dev = sget(DEVKEY) === "1" || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

  function decode(s) {
    try {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(decodeURIComponent(escape(atob(s))));
    } catch (e) { return null; }
  }
  function encode(o) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  var state = { preset: DEFAULT, mode: "auto" };
  var saved = null;
  try { saved = JSON.parse(sget(KEY) || "null"); } catch (e) {}
  var shared = qs.get("style") ? decode(qs.get("style")) : null;
  Object.assign(state, saved || {}, shared || {});
  if (!PRESETS[state.preset]) state.preset = DEFAULT;
  if (!(state.mode === "light" || state.mode === "dark")) state.mode = "auto";

  var ALLVARS = {};
  Object.keys(PRESETS).forEach(function (n) {
    ["vars", "light", "dark"].forEach(function (sec) {
      Object.keys(PRESETS[n][sec] || {}).forEach(function (k) { ALLVARS[k] = 1; });
    });
  });
  ALLVARS = Object.keys(ALLVARS);

  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function isDark() { return state.mode === "dark" || (state.mode === "auto" && mq && mq.matches); }
  function persist() { sset(KEY, JSON.stringify(state)); }

  function curOptions() {
    var o = PRESETS[state.preset].options || {};
    return { sidebar: state.sidebar || o.sidebar || "left", banner: state.banner || o.banner || "on", nav: state.nav || o.nav || "collapsible" };
  }

  function apply() {
    var p = PRESETS[state.preset];
    ALLVARS.forEach(function (n) { root.style.removeProperty("--" + n); });
    if (state.mode === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", state.mode);
    var set = Object.assign({}, p.vars, p.light, isDark() ? p.dark : {});
    if (state.accent) { set.accent = state.accent; set.link = state.accent; }
    if (state.header) set["header-bg"] = state.header;
    if (state.font && FONTS[state.font]) { set.font = FONTS[state.font]; set["heading-font"] = FONTS[state.font]; }
    if (state.size) set["font-size"] = state.size + "px";
    if (state.width) set["content-width"] = state.width + "rem";
    Object.keys(set).forEach(function (k) { root.style.setProperty("--" + k, set[k]); });
    var o = curOptions();
    root.setAttribute("data-sidebar", o.sidebar);
    root.setAttribute("data-banner", o.banner);
    root.setAttribute("data-nav", o.nav);
  }
  apply();
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (state.mode === "auto") { apply(); sync(); } });

  /* ---------- the panel (only built in dev mode) ---------- */
  var panel;
  function $(id) { return panel.querySelector("#" + id); }
  function hexOf(name, fallback) {
    var v = getComputedStyle(root).getPropertyValue("--" + name).trim();
    return /^#[0-9a-f]{6}$/i.test(v) ? v : fallback;
  }
  function sync() {
    if (!panel) return;
    $("sp-preset").value = state.preset;
    panel.querySelectorAll("input[name=sp-mode]").forEach(function (r) { r.checked = (r.value === state.mode); });
    $("sp-accent").value = state.accent || hexOf("accent", "#00693e");
    $("sp-header").value = state.header || hexOf("header-bg", "#00693e");
    $("sp-font").value = state.font || "";
    var size = state.size || parseInt(getComputedStyle(root).getPropertyValue("--font-size"), 10) || 16;
    var width = state.width || parseInt(getComputedStyle(root).getPropertyValue("--content-width"), 10) || 56;
    $("sp-size").value = size; $("sp-size-v").textContent = size + "px";
    $("sp-width").value = width; $("sp-width-v").textContent = width + "rem";
    var o = curOptions();
    $("sp-sidebar").value = o.sidebar;
    $("sp-nav").value = o.nav;
    var topBar = o.sidebar === "top" && window.matchMedia("(min-width: 52.01rem)").matches;
    $("sp-nav").disabled = topBar;
    $("sp-nav").title = topBar ? "In the top layout the groups are always dropdowns" : "";
    var hasBanner = !!document.querySelector(".site-header .banner");
    $("sp-banner").checked = o.banner === "on" && hasBanner;
    $("sp-banner").disabled = !hasBanner;
  }
  function change(key, value) { state[key] = value; persist(); apply(); sync(); }

  function q(s) { return JSON.stringify(String(s)); }
  function presetYaml(name) {
    var p = PRESETS[state.preset];
    var o = curOptions();
    var out = { label: "My style (from " + p.label + ")", options: o,
                vars: Object.assign({}, p.vars), light: Object.assign({}, p.light), dark: Object.assign({}, p.dark) };
    ["light", "dark"].forEach(function (m) {
      if (state.accent) { out[m].accent = state.accent; out[m].link = state.accent; }
      if (state.header) out[m]["header-bg"] = state.header;
    });
    if (state.font && FONTS[state.font]) { out.vars.font = FONTS[state.font]; out.vars["heading-font"] = FONTS[state.font]; }
    if (state.size) out.vars["font-size"] = state.size + "px";
    if (state.width) out.vars["content-width"] = state.width + "rem";
    var L = [name + ":", "  label: " + q(out.label), "  options:"];
    Object.keys(out.options).forEach(function (k) { L.push("    " + k + ": " + q(out.options[k])); });
    ["vars", "light", "dark"].forEach(function (sec) {
      L.push("  " + sec + ":");
      Object.keys(out[sec]).forEach(function (k) { L.push("    " + q(k) + ": " + q(out[sec][k])); });
    });
    return L.join("\n") + "\n";
  }
  function shareLink() {
    var s = {};
    Object.keys(state).forEach(function (k) { if (state[k] !== null && state[k] !== "" && state[k] !== undefined) s[k] = state[k]; });
    return location.origin + location.pathname + "?dev&style=" + encode(s);
  }
  function show(text, note) {
    var out = $("sp-out"); out.value = text; out.style.display = "block"; out.focus(); out.select();
    $("sp-note").textContent = note + ". Select all and copy.";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { $("sp-note").textContent = note + " (copied to clipboard)."; },
        function () { /* not allowed here: the text stays selected for a manual copy */ });
    }
  }

  function build() {
    var css = document.createElement("style");
    css.textContent =
      "#sp-toggle{position:fixed;right:14px;bottom:14px;z-index:99999;background:#222;color:#fff;border:0;border-radius:999px;padding:.5rem .9rem;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}" +
      "#sp-panel{position:fixed;right:14px;bottom:60px;z-index:99999;width:19rem;max-height:80vh;overflow:auto;background:#fff;color:#222;border:1px solid #bbb;border-radius:10px;padding:.8rem .9rem;font:13px/1.4 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.3);display:none}" +
      "#sp-panel.open{display:block}#sp-panel h2{margin:0 0 .5rem;font:700 14px system-ui,sans-serif}" +
      "#sp-panel label{display:block;margin:.55rem 0 .15rem;font-weight:600}#sp-panel select,#sp-panel textarea{width:100%;font:inherit;box-sizing:border-box}" +
      "#sp-panel input[type=range]{width:100%}#sp-panel .row{display:flex;gap:.5rem;align-items:center}#sp-panel .row label{margin:0;font-weight:400}" +
      "#sp-panel button{font:inherit;padding:.3rem .55rem;margin:.5rem .3rem 0 0;border:1px solid #888;border-radius:6px;background:#f3f3f3;color:#222;cursor:pointer}" +
      "#sp-out{display:none;height:9rem;margin-top:.5rem;font:11px/1.3 ui-monospace,monospace}#sp-note{color:#555;min-height:1.2em;margin-top:.3rem}";
    document.head.appendChild(css);

    var tgl = document.createElement("button");
    tgl.id = "sp-toggle"; tgl.type = "button"; tgl.textContent = "Style";
    tgl.setAttribute("aria-expanded", "false");
    panel = document.createElement("div");
    panel.id = "sp-panel";
    panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "Style switcher");
    var opts = Object.keys(PRESETS).map(function (n) { return '<option value="' + n + '">' + PRESETS[n].label + "</option>"; }).join("");
    var fonts = '<option value="">(preset default)</option>' + Object.keys(FONTS).map(function (n) { return '<option value="' + n + '">' + FONT_LABELS[n] + "</option>"; }).join("");
    panel.innerHTML =
      "<h2>Style switcher</h2>" +
      '<label for="sp-preset">Preset</label><select id="sp-preset">' + opts + "</select>" +
      '<label>Color mode</label><div class="row">' +
        '<label><input type="radio" name="sp-mode" value="auto"> Auto</label>' +
        '<label><input type="radio" name="sp-mode" value="light"> Light</label>' +
        '<label><input type="radio" name="sp-mode" value="dark"> Dark</label></div>' +
      '<div class="row"><div><label for="sp-accent">Accent / links</label><input type="color" id="sp-accent"></div>' +
      '<div><label for="sp-header">Header</label><input type="color" id="sp-header"></div></div>' +
      '<label for="sp-font">Font</label><select id="sp-font">' + fonts + "</select>" +
      '<label for="sp-size">Text size <span id="sp-size-v"></span></label><input type="range" id="sp-size" min="14" max="22" step="1">' +
      '<label for="sp-width">Content width <span id="sp-width-v"></span></label><input type="range" id="sp-width" min="36" max="90" step="2">' +
      '<label for="sp-sidebar">Navigation</label><select id="sp-sidebar"><option value="left">Sidebar left</option><option value="right">Sidebar right</option><option value="top">Across the top</option></select>' +
      '<label for="sp-nav">Menu groups</label><select id="sp-nav"><option value="expanded">All expanded</option><option value="collapsible">Collapsible</option><option value="accordion">Accordion (one open)</option></select>' +
      '<div class="row" style="margin-top:.55rem"><input type="checkbox" id="sp-banner"><label for="sp-banner">Banner image (instead of title text)</label></div>' +
      '<div><button type="button" id="sp-reset">Reset</button><button type="button" id="sp-link">Copy link</button><button type="button" id="sp-yaml">Copy as preset</button></div>' +
      '<div id="sp-note"></div><textarea id="sp-out" readonly></textarea>';
    document.body.appendChild(panel);
    document.body.appendChild(tgl);

    tgl.addEventListener("click", function () {
      var open = panel.classList.toggle("open");
      tgl.setAttribute("aria-expanded", open ? "true" : "false");
    });
    $("sp-preset").addEventListener("change", function (e) {
      state = { preset: e.target.value, mode: state.mode }; persist(); apply(); sync();
    });
    panel.querySelectorAll("input[name=sp-mode]").forEach(function (r) {
      r.addEventListener("change", function () { change("mode", r.value); });
    });
    $("sp-accent").addEventListener("input", function (e) { change("accent", e.target.value); });
    $("sp-header").addEventListener("input", function (e) { change("header", e.target.value); });
    $("sp-font").addEventListener("change", function (e) { change("font", e.target.value || null); });
    $("sp-size").addEventListener("input", function (e) { change("size", +e.target.value); });
    $("sp-width").addEventListener("input", function (e) { change("width", +e.target.value); });
    $("sp-sidebar").addEventListener("change", function (e) { change("sidebar", e.target.value); });
    $("sp-nav").addEventListener("change", function (e) { change("nav", e.target.value); });
    $("sp-banner").addEventListener("change", function (e) { change("banner", e.target.checked ? "on" : "off"); });
    $("sp-reset").addEventListener("click", function () {
      state = { preset: DEFAULT, mode: "auto" }; persist(); apply(); sync();
      $("sp-out").style.display = "none"; $("sp-note").textContent = "Back to the site default.";
    });
    $("sp-link").addEventListener("click", function () { show(shareLink(), "Link with these settings"); });
    $("sp-yaml").addEventListener("click", function () {
      show(presetYaml("my_style"), "Paste into _data/styles.yml, then set  style: my_style  in _config.yml");
    });
    sync();
  }

  if (dev) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", build); else build();
  }
})();
</script>
