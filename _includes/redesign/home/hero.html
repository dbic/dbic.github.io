{%- assign h = site.data.home.hero -%}
<section class="hero" aria-labelledby="h1">
  <canvas id="neural" aria-hidden="true"></canvas>
  {%- if site.data.brand.hero_watermark and site.data.brand.logo != '' %}
  <img class="hero-mark" src="{{ site.data.brand.logo | relative_url }}" alt="" aria-hidden="true">
  {%- endif %}
  <div class="wrap hero-in">
    <p class="eyebrow-w">{{ h.eyebrow | escape }}</p>
    <h1 id="h1">{{ h.title | escape }}</h1>
    <p class="lead">{{ h.lead_prefix | escape }} <span class="rot" id="rot" aria-hidden="true" data-words="{{ h.words | jsonify | escape }}" data-static="{{ h.static_words | escape }}">{{ h.words | first | escape }}</span><span class="sr"> {{ h.static_words | escape }}</span>.</p>
    <p class="sub">{{ h.text | escape }}</p>
  </div>
</section>
