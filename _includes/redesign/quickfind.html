<dialog id="qf" aria-label="Quick find">
  <div class="qf-box">
    <div class="qf-head">
      <input id="qf-input" type="search" placeholder="Find a page or answer… try “rates” or “safety”" aria-label="Search the site" autocomplete="off">
      <button type="button" class="icon-btn" id="qf-close" aria-label="Close search">✕</button>
    </div>
    <ul id="qf-list" role="list"></ul>
    <p class="qf-foot">↑ ↓ to move · Enter to open · Esc to close</p>
  </div>
</dialog>
