title: Dartmouth Brain Imaging Center
description: Research resource for brain imaging at Dartmouth College

# If the site is served from a project path (username.github.io/repo),
# set baseurl to "/repo". For an organization site at dbic.github.io, leave it empty.
baseurl: ""

# Banner image shown at the top of every page. Download the file first (see README),
# then uncomment. Without it, the site title is shown as text.
# header_image: /assets/dbic/images/header_full.jpg

# Look and feel. "style" names a preset in _data/styles.yml.
style: default
# Floating "Style" panel for trying looks (appears only with ?dev in the address, or
# on localhost). Set to false once the look is decided, so the published site
# carries none of this code.
style_switcher: true

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Apply our layout to every page that has front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Files that live in the repo but should not be published on the site.
exclude:
  - README.md
  - crawl_to_markdown.py
  - environment.yml
  - manifest.csv
  - broken_links.csv
  - css_images.csv
  - check_links.py
  - link_report.csv
  - .gitignore
