title: Dartmouth Brain Imaging Center
description: Research resource for brain imaging at Dartmouth College

# If the site is served from a project path (username.github.io/repo),
# set baseurl to "/repo". For an organization site at dbic.github.io, leave it empty.
baseurl: ""

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Apply our layout to every page that has front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Links to other web addresses always open in a new tab. The paths listed here are separate sites that share
# this address (the PBS_resources project site), so links to them also open in a new tab and the DBIC site stays open.
new_tab_paths:
  - /PBS_resources/

# Files that live in the repo but should not be published on the site.
exclude:
  - "*.py"          # the helper scripts (check_events.py, merge_events.py, ...) are not part of the site
  - README.md
  - crawl_to_markdown.py
  - environment.yml
  - manifest.csv
  - broken_links.csv
  - css_images.csv
  - check_links.py
  - link_report.csv
  - .gitignore
